[versions]
agp = "9.4.0"
kotlin = "2.4.20"
composeBom = "2025.10.01"
activityCompose = "1.11.0"
lifecycle = "2.9.4"
libsu = "6.0.0"
zstdJni = "1.5.7-4"
commonsCompress = "1.27.1"
xz = "1.10"
zip4j = "2.11.5"
jgit = "5.13.3.202401111512-r"
slf4j = "2.0.16"
coil = "3.3.0"
media3 = "1.8.0"
junit = "4.13.2"

[libraries]
androidx-compose-bom = { group = "androidx.compose", name = "compose-bom", version.ref = "composeBom" }
androidx-compose-material3 = { group = "androidx.compose.material3", name = "material3" }
androidx-compose-foundation = { group = "androidx.compose.foundation", name = "foundation" }
androidx-compose-icons-extended = { group = "androidx.compose.material", name = "material-icons-extended" }
androidx-activity-compose = { group = "androidx.activity", name = "activity-compose", version.ref = "activityCompose" }
androidx-lifecycle-viewmodel-compose = { group = "androidx.lifecycle", name = "lifecycle-viewmodel-compose", version.ref = "lifecycle" }

libsu-core = { group = "com.github.topjohnwu.libsu", name = "core", version.ref = "libsu" }

zstd-jni = { group = "com.github.luben", name = "zstd-jni", version.ref = "zstdJni" }
commons-compress = { group = "org.apache.commons", name = "commons-compress", version.ref = "commonsCompress" }
xz = { group = "org.tukaani", name = "xz", version.ref = "xz" }
zip4j = { group = "net.lingala.zip4j", name = "zip4j", version.ref = "zip4j" }

jgit = { group = "org.eclipse.jgit", name = "org.eclipse.jgit", version.ref = "jgit" }
slf4j-jdk14 = { group = "org.slf4j", name = "slf4j-jdk14", version.ref = "slf4j" }


coil-compose = { group = "io.coil-kt.coil3", name = "coil-compose", version.ref = "coil" }
media3-exoplayer = { group = "androidx.media3", name = "media3-exoplayer", version.ref = "media3" }
media3-ui = { group = "androidx.media3", name = "media3-ui", version.ref = "media3" }

junit = { group = "junit", name = "junit", version.ref = "junit" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
